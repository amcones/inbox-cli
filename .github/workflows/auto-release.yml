name: Auto tag release

on:
  push:
    branches:
      - main
    paths:
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - README.md
      - README.zh-CN.md
      - scripts/check-version.py
      - .github/workflows/auto-release.yml
      - .github/workflows/release.yml

permissions: {}

jobs:
  tag:
    name: Create version tag
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      created: ${{ steps.release.outputs.created }}
      tag: ${{ steps.release.outputs.tag }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate and create tag
        id: release
        shell: bash
        run: |
          python3 scripts/check-version.py

          version="$(
            cargo metadata --no-deps --format-version 1 |
            jq -r '.packages[] | select(.name == "inbox") | .version'
          )"
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          previous_version="$(
            git show "$GITHUB_SHA^1:Cargo.toml" |
            sed -nE 's/^version = "([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' |
            head -n 1
          )"
          if [[ "$previous_version" == "$version" ]]; then
            echo "Cargo version is unchanged at $version; no release tag is needed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; no release tag is needed."
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "$tag" "$GITHUB_SHA" --message "Release $tag"
          git push origin "refs/tags/$tag"
          echo "created=true" >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish
    needs: tag
    if: needs.tag.outputs.created == 'true'
    permissions:
      actions: read
      contents: write
    uses: ./.github/workflows/release.yml
    with:
      tag: ${{ needs.tag.outputs.tag }}
