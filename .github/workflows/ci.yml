name: PR binaries

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - main
      - develop

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  source-branch:
    name: PR source policy
    runs-on: ubuntu-24.04

    steps:
      - name: Validate PR source and target
        env:
          BASE_BRANCH: ${{ github.base_ref }}
          HEAD_BRANCH: ${{ github.head_ref }}
          HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          BASE_REPOSITORY: ${{ github.repository }}

        run: |
          case "$BASE_BRANCH" in
            main)
              if [[ "$HEAD_BRANCH" != "develop" || "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
                echo "PRs targeting main must come from this repository's develop branch." >&2
                exit 1
              fi
              ;;

            develop)
              case "$HEAD_BRANCH" in
                main)
                  if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
                    echo "Only this repository's main branch may synchronize release history." >&2
                    exit 1
                  fi
                  ;;

                dependabot/?*)
                  if [[ "$HEAD_REPOSITORY" != "$BASE_REPOSITORY" ]]; then
                    echo "Dependabot PRs must originate from this repository." >&2
                    exit 1
                  fi
                  ;;

                feat/?*|fix/?*|docs/?*|refactor/?*|chore/?*|ci/?*|test/?*|perf/?*|build/?*|revert/?*)
                  ;;

                *)
                  echo "PRs targeting develop must use a topic branch (feat/fix/docs/refactor/chore/ci/test/perf/build/revert/*), a same-repository Dependabot branch (dependabot/*), or main for release synchronization." >&2
                  exit 1
                  ;;
              esac
              ;;

            *)
              echo "Unsupported PR target: $BASE_BRANCH." >&2
              exit 1
              ;;
          esac

  quality:
    name: Rust quality
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

  msrv:
    name: Rust 1.89
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.89.0

      - name: Check MSRV
        run: cargo check --all-targets --locked

  platform:
    name: ${{ matrix.name }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14

          - name: macOS x86_64
            os: macos-15-intel

          - name: Linux ARM64
            os: ubuntu-24.04-arm

          - name: Linux x86_64
            os: ubuntu-24.04

          - name: Windows x86_64
            os: windows-2025

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build release binary
        run: cargo build --release --locked

      - name: Verify Unix build and install scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/build.sh scripts/install.sh
          scripts/build.sh
          scripts/install.sh \
            --no-build \
            --shell none \
            --bin-dir "$RUNNER_TEMP/inbox-bin"
          "$RUNNER_TEMP/inbox-bin/inbox" --version

      - name: Verify Windows build and install scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/install.ps1 `
            -NoBuild `
            -Shell none `
            -BinDir "$env:RUNNER_TEMP\inbox-bin"
          & "$env:RUNNER_TEMP\inbox-bin\inbox.exe" --version

  gate:
    name: CI gate
    if: ${{ always() }}

    needs:
      - source-branch
      - quality
      - msrv
      - platform

    runs-on: ubuntu-24.04

    steps:
      - name: Require all checks
        if: >-
          ${{
            needs.source-branch.result != 'success' ||
            needs.quality.result != 'success' ||
            needs.msrv.result != 'success' ||
            needs.platform.result != 'success'
          }}

        run: |
          echo "Source policy result: ${{ needs.source-branch.result }}"
          echo "Quality result:       ${{ needs.quality.result }}"
          echo "MSRV result:          ${{ needs.msrv.result }}"
          echo "Platform result:      ${{ needs.platform.result }}"
          exit 1

      - name: Checks passed
        run: echo "All required source, quality, MSRV, platform, and script checks passed."