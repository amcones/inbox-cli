name: PR binaries

on:
  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read

jobs:
  msrv:
    name: Rust 1.89
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.89.0
      - run: cargo check --all-targets --locked

  platform:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS ARM64
            os: macos-14
          - name: macOS x86_64
            os: macos-15-intel
          - name: Linux ARM64
            os: ubuntu-24.04-arm
          - name: Linux x86_64
            os: ubuntu-24.04
          - name: Windows x86_64
            os: windows-2025
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo build --release --locked
      - name: Verify build and install scripts
        if: runner.os != 'Windows'
        shell: bash
        run: |
          bash -n scripts/build.sh scripts/install.sh
          scripts/build.sh
          scripts/install.sh --no-build --shell none --bin-dir "$RUNNER_TEMP/inbox-bin"
          "$RUNNER_TEMP/inbox-bin/inbox" --version
      - name: Verify Windows build and install scripts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/build.ps1
          ./scripts/install.ps1 -NoBuild -Shell none -BinDir "$env:RUNNER_TEMP\inbox-bin"
          & "$env:RUNNER_TEMP\inbox-bin\inbox.exe" --version

  gate:
    name: CI gate
    if: ${{ always() }}
    needs:
      - msrv
      - platform
    runs-on: ubuntu-24.04
    steps:
      - name: Require all platform checks
        if: ${{ needs.msrv.result != 'success' || needs.platform.result != 'success' }}
        run: |
          echo "MSRV result: ${{ needs.msrv.result }}"
          echo "Platform result: ${{ needs.platform.result }}"
          exit 1
      - name: Checks passed
        run: echo "All required Rust, platform, and script checks passed."
