name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_call:
    inputs:
      tag:
        description: Existing version tag to build and publish
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  actions: read
  contents: read

jobs:
  verify-tag:
    name: Validate release tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - name: Validate tag, version, changelog, and branch
        run: |
          if ! [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must use vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          python3 scripts/check-version.py
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "inbox") | .version')"
          test "$RELEASE_TAG" = "v$version"
          test "$(git rev-list -n 1 "$RELEASE_TAG")" = "$GITHUB_SHA"
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  unix:
    name: ${{ matrix.asset }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: inbox-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: inbox-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: inbox-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: inbox-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify binary
        run: target/${{ matrix.target }}/release/inbox --version
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp target/${{ matrix.target }}/release/inbox README.md LICENSE scripts/install.sh scripts/update.sh scripts/completion.bash scripts/completion.zsh scripts/completion.fish dist/${{ matrix.asset }}/
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          else
            (cd dist && shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: inbox-windows-x86_64
    needs: verify-tag
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify binary
        run: target\x86_64-pc-windows-msvc\release\inbox.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\inbox-windows-x86_64 | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\inbox.exe, README.md, LICENSE, scripts\install.ps1, scripts\update.ps1, scripts\completion.powershell dist\inbox-windows-x86_64\
          Compress-Archive -Path dist\inbox-windows-x86_64 -DestinationPath dist\inbox-windows-x86_64.zip
          $hash = (Get-FileHash dist\inbox-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  inbox-windows-x86_64.zip" | Set-Content -NoNewline dist\inbox-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: inbox-windows-x86_64
          path: |
            dist/inbox-windows-x86_64.zip
            dist/inbox-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - unix
      - windows
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Prepare release notes
        run: |
          version="${RELEASE_TAG#v}"
          awk -v heading="## $version " '
            index($0, heading) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md
      - name: Create draft, upload binaries, and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(find dist -maxdepth 1 -type f | wc -l)" -eq 10
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "$RELEASE_TAG" --notes-file release-notes.md
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" dist/*
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
