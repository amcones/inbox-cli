name: Release binaries

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-tag:
    name: Tag is on main
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Verify tagged commit belongs to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  unix:
    name: ${{ matrix.asset }}
    needs: verify-tag
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: inbox-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: inbox-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: inbox-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: inbox-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify binary
        run: target/${{ matrix.target }}/release/inbox --version
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp target/${{ matrix.target }}/release/inbox README.md LICENSE dist/${{ matrix.asset }}/
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          else
            (cd dist && shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            dist/${{ matrix.asset }}.tar.gz
            dist/${{ matrix.asset }}.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: inbox-windows-x86_64
    needs: verify-tag
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify binary
        run: target\x86_64-pc-windows-msvc\release\inbox.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\inbox-windows-x86_64 | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\inbox.exe, README.md, LICENSE dist\inbox-windows-x86_64\
          Compress-Archive -Path dist\inbox-windows-x86_64 -DestinationPath dist\inbox-windows-x86_64.zip
          $hash = (Get-FileHash dist\inbox-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  inbox-windows-x86_64.zip" | Set-Content -NoNewline dist\inbox-windows-x86_64.zip.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: inbox-windows-x86_64
          path: |
            dist/inbox-windows-x86_64.zip
            dist/inbox-windows-x86_64.zip.sha256
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - unix
      - windows
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - name: Create release and upload binaries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" dist/*
