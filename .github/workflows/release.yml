name: Release binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag and release to build
        required: true
        default: v0.2.1

permissions:
  contents: write

jobs:
  unix:
    name: ${{ matrix.asset }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            asset: inbox-macos-aarch64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            asset: inbox-macos-x86_64
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            asset: inbox-linux-x86_64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset: inbox-linux-aarch64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Verify native binary
        run: target/${{ matrix.target }}/release/inbox --version
      - name: Package
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.asset }}
          cp target/${{ matrix.target }}/release/inbox README.md LICENSE dist/${{ matrix.asset }}/
          tar -C dist -czf dist/${{ matrix.asset }}.tar.gz ${{ matrix.asset }}
          if command -v sha256sum >/dev/null; then
            (cd dist && sha256sum ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          else
            (cd dist && shasum -a 256 ${{ matrix.asset }}.tar.gz > ${{ matrix.asset }}.tar.gz.sha256)
          fi
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist/${{ matrix.asset }}.tar.gz dist/${{ matrix.asset }}.tar.gz.sha256 --clobber

  windows:
    name: inbox-windows-x86_64
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc
      - name: Verify binary
        run: target\x86_64-pc-windows-msvc\release\inbox.exe --version
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\inbox-windows-x86_64 | Out-Null
          Copy-Item target\x86_64-pc-windows-msvc\release\inbox.exe, README.md, LICENSE dist\inbox-windows-x86_64\
          Compress-Archive -Path dist\inbox-windows-x86_64 -DestinationPath dist\inbox-windows-x86_64.zip
          $hash = (Get-FileHash dist\inbox-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  inbox-windows-x86_64.zip" | Set-Content -NoNewline dist\inbox-windows-x86_64.zip.sha256
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" dist\inbox-windows-x86_64.zip dist\inbox-windows-x86_64.zip.sha256 --clobber
