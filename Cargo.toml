[package]
name = "inbox"
version = "0.2.2"
edition = "2024"
rust-version = "1.89"
description = "A tiny, local-first Markdown inbox for fleeting ideas"
license = "MIT"

[dependencies]
jiff = { version = "0.2", default-features = false, features = ["std", "tz-system", "tzdb-zoneinfo", "tzdb-bundle-platform"] }
lexopt = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", default-features = false, features = ["std", "v4"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[profile.speed]
inherits = "release"
opt-level = 3

[profile.small]
inherits = "release"
opt-level = "z"
